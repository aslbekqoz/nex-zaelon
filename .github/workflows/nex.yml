# NEX ZAELON — bulutda avtomatik ishlaydi (laptop kerak emas).
# Har 30 daqiqada: Telegram botga yuborilgan qo'shiqlarni oladi -> montaj -> YouTube'ga rejalashtirib yuklaydi.
# Kalitlar faqat GitHub Secrets'da turadi (repo ichida hech qachon yo'q).
name: Nex Zaelon

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

concurrency:
  group: nex-zaelon
  cancel-in-progress: false

jobs:
  nex:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # Faqat kerakli kalitlar, har biri nomi bilan (hammasini birdan olish GitHub'da shubha uyg'otadi)
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODELS: ${{ secrets.GEMINI_MODELS }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      NEX_YOUTUBE_REFRESH_TOKEN: ${{ secrets.NEX_YOUTUBE_REFRESH_TOKEN }}
      NEX_SLOTS: '11:30,17:30,23:30'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Kutubxonalar
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Oldingi holat (qaysi qo'shiqlar qilingan)
        uses: actions/cache/restore@v4
        with:
          path: nex-runs
          key: nex-state-${{ github.run_id }}
          restore-keys: nex-state-

      - name: Telegram'dan yangi qo'shiqlar
        id: pull
        run: node src/nex/cloud.js pull

      - name: ffmpeg
        if: steps.pull.outputs.work == '1'
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Brauzer (sahnalarni chizish uchun) — kesh
        if: steps.pull.outputs.work == '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-1.56.1

      - name: Brauzer o'rnatish
        if: steps.pull.outputs.work == '1'
        run: npx playwright-core install --with-deps chromium

      - name: Montaj va yuklash
        if: steps.pull.outputs.work == '1'
        run: node src/nex/run.js

      - name: Tozalash
        if: always() && steps.pull.outputs.work == '1'
        run: node src/nex/cloud.js cleanup

      - name: Holatni saqlash
        if: always() && steps.pull.outputs.work == '1'
        uses: actions/cache/save@v4
        with:
          path: nex-runs
          key: nex-state-${{ github.run_id }}

      - name: Log
        if: always()
        run: tail -n 60 nex-runs/*/log.txt 2>/dev/null | tail -n 120 || true
