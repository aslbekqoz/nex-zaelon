# CineMind AI checks: run on every push and pull request that touches cinemind/.
# Independent of the Nex Zaelon workflow; needs no secrets.
name: CineMind

on:
  push:
    branches: [main]
    paths: ["cinemind/**", ".github/workflows/cinemind.yml"]
  pull_request:
    paths: ["cinemind/**", ".github/workflows/cinemind.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cinemind-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, migrate, build, smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cinemind
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cinemind
          POSTGRES_PASSWORD: cinemind
          POSTGRES_DB: cinemind
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cinemind"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://cinemind:cinemind@localhost:5432/cinemind
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cinemind/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

      - name: Migrate and seed (twice, both must be safe to re-run)
        run: npm run db:setup && npm run db:setup

      - run: npm run build

      - name: Smoke test the production server
        env:
          PORT: 3000
          APP_URL: http://localhost:3000
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3000/api/health > /dev/null && break; sleep 1; done
          fail=0
          for path in / /search "/search?q=matrix" /movies/1 /login /register /forgot-password /robots.txt /sitemap.xml /api/health; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "localhost:3000$path")
            echo "$code $path"
            [ "$code" = 200 ] || fail=1
          done
          # Staff areas must not be reachable when signed out
          for path in /studio /admin /account; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "localhost:3000$path")
            echo "$code $path (signed out)"
            [ "$code" = 307 ] || fail=1
          done
          if [ "$fail" != 0 ]; then cat server.log; exit 1; fi

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cinemind:ci cinemind
